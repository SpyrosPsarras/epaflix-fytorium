name: Test and publish image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install in container
        run: ./scripts/container install --frozen-lockfile
      - name: Typecheck
        run: ./scripts/container typecheck
      - name: Unit tests
        run: ./scripts/container test:unit
      - name: API tests
        run: ./scripts/container test:api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          build-args: SERVER_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/spyrospsarras/epaflix-fytorium:${{ github.sha }}
            ghcr.io/spyrospsarras/epaflix-fytorium:latest
      - name: Report image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "ghcr.io/spyrospsarras/epaflix-fytorium@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
