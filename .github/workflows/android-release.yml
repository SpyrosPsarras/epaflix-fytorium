name: Android release
on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.repository == 'SpyrosPsarras/epaflix-fytorium' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - name: Validate tag and increasing versionCode
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED_TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and (.tag_name | startswith("android-v"))) | .tag_name')
          export PUBLISHED_TAGS
          ./scripts/android release-version "$RELEASE_TAG" > "$RUNNER_TEMP/android-version"
          grep -E '^(versionName|versionCode|previousTag)=' "$RUNNER_TEMP/android-version" | tee -a "$GITHUB_OUTPUT"
      - name: Full Android suite in Docker
        run: |
          ./scripts/android build
          ./scripts/android test
          ./scripts/android lint
          ./scripts/android screenshots
          ./scripts/android release-check
      - name: Decode signing key into runner temp
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          test -s "$RUNNER_TEMP/android-release.p12"
      - name: Build signed APK in Docker
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "GOOGLE_SERVICES_JSON secret is required" >&2; exit 1; }
          ./scripts/android release-build "$RELEASE_TAG"
      - name: Verify release certificate and checksum in Docker
        # apksigner verify --print-certs must match this SHA-256, not a debug key.
        # 8A:A9:74:16:85:B7:03:12:75:7F:44:37:2E:B0:36:3B:16:F2:C6:A9:11:03:6C:EE:77:7A:9F:39:11:62:0C:F7
        run: ./scripts/android release-verify "$RELEASE_TAG"
      - name: Delete signing key even after failure
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12"
      - name: Publish APK, checksum and Android changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previousTag }}
        run: |
          notes="$RUNNER_TEMP/android-release-notes.md"
          {
            printf 'Fytorium %s, versionCode %s\n\n' "$VERSION" "$VERSION_CODE"
            printf 'Signing certificate SHA-256: %s\n\n' '8A:A9:74:16:85:B7:03:12:75:7F:44:37:2E:B0:36:3B:16:F2:C6:A9:11:03:6C:EE:77:7A:9F:39:11:62:0C:F7'
            printf '## Android changelog\n\n'
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --format='- %s (%h)' "$PREVIOUS_TAG..$RELEASE_TAG" -- android/
            else
              git log --format='- %s (%h)' "$RELEASE_TAG" -- android/
            fi
          } > "$notes"
          output="android/app/build/outputs/fytorium-releases/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Fytorium Android $VERSION" --notes-file "$notes" \
            "$output/fytorium-$VERSION.apk" "$output/SHA256SUMS"
