openapi: 3.1.0
info:
  title: Fytorium native and web API
  version: 1.0.0
  description: "One household per server. Login uses cookies or A01 device bearer tokens. Authorization is
    deny-by-default; sitters receive named projections. Dates are household calendar dates unless marked
    timestamps. Send Accept: application/json. Cookie writes require same-origin Origin checks; verified
    bearer writes do not. API errors use message or errors, and app authentication uses error. MIN_APP_VERSION
    never blocks requests without X-App-Version, /api/meta or /api/app/*."
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/meta:
    get:
      operationId: get_api_meta
      summary: Household date, timezone, role and application versions. All members, including sitters.
      responses:
        "200":
          description: JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/me:
    get:
      operationId: get_api_me
      summary: GET /api/me
      responses:
        "200":
          description: JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "426":
          description: X-App-Version is invalid or below MIN_APP_VERSION. Requests without this header are never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequired"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema:
            type: string
  /api/app/token:
    post:
      operationId: post_api_app_token
      summary: POST /api/app/token
      responses:
        "200":
          description: JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    grant_type:
                      const: authorization_code
                    code:
                      type: string
                    code_verifier:
                      type: string
                    device_name:
                      type: string
                  required:
                    - grant_type
                    - code
                    - code_verifier
                    - device_name
                  additionalProperties: false
                - type: object
                  properties:
                    grant_type:
                      const: refresh_token
                    refresh_token:
                      type: string
                  required:
                    - grant_type
                    - refresh_token
                  additionalProperties: false
      security: []
  /api/app/logout:
    post:
      operationId: post_api_app_logout
      summary: POST /api/app/logout
      responses:
        "204":
          description: No content
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plants/count:
    get:
      operationId: get_api_plants_count
      summary: Active visible plant count. Sitters count only shared active plants, independent of task filters.
      responses:
        "200":
          description: JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "426":
          description: X-App-Version is invalid or below MIN_APP_VERSION. Requests without this header are never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequired"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema:
            type: string
  /api/choices:
    get:
      operationId: get_api_choices
      summary: Web plant form choices and name languages. Owner and family only; sitters are denied.
      responses:
        "200":
          description: Shared editing choices
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plant, nameLanguages]
                properties:
                  plant:
                    type: object
                    additionalProperties: false
                    required: [choices, labels, numbers, booleans, health]
                    properties:
                      choices:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }
                      labels:
                        type: object
                        additionalProperties: { type: string }
                      numbers:
                        type: array
                        items: { type: string }
                      booleans:
                        type: array
                        items: { type: string }
                      health:
                        type: array
                        items: { type: string }
                  nameLanguages:
                    type: object
                    additionalProperties: { type: string }
        "426":
          description: Application update required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequired"
        default:
          description: Login or authorization error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema: { type: string }
  /api/plants:
    get:
      operationId: get_api_plants
      summary: Plant list. Sitters receive shared active headers only; count, site and graveyard filters are denied.
      responses:
        "200":
          description: JSON response
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/Plant"
                        - $ref: "#/components/schemas/PlantHeader"
                  - $ref: "#/components/schemas/Count"
        "426":
          description: X-App-Version is invalid or below MIN_APP_VERSION. Requests without this header are never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequired"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            enum:
              - active
              - graveyard
        - name: count
          in: query
          required: false
          schema:
            enum:
              - "true"
              - "false"
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    post:
      operationId: post_api_plants
      summary: POST /api/plants
      responses:
        "201":
          description: JSON response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "426":
          description: X-App-Version is invalid or below MIN_APP_VERSION. Requests without this header are never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequired"
        default:
          description: Login, authorization, input, conflict, rate-limit or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: X-App-Version
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantInput"
  /api/plants/{id}:
    get:
      operationId: get_api_plants__id_
