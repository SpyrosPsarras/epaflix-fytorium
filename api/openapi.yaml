components:
  responses:
    ApiError:
      description: API error, including an unsafe method refused by the origin guard before routing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpdateRequired:
      description: Native client version below the configured minimum.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateRequired"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: fytorium_session
  schemas:
    Error:
      anyOf:
        - type: object
          properties:
            message:
              type: string
            reason:
              type: string
          required:
            - message
          additionalProperties: true
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
          required:
            - errors
          additionalProperties: false
        - type: object
          properties:
            error:
              enum:
                - invalid_grant
                - invalid_token
                - rate_limited
          required:
            - error
          additionalProperties: false
    UpdateRequired:
      type: object
      properties:
        error:
          const: update_required
        minAppVersion:
          type: string
      required:
        - error
        - minAppVersion
      additionalProperties: false
    Meta:
      type: object
      properties:
        minAppVersion:
          anyOf:
            - type: string
            - type: "null"
        serverVersion:
          type: string
        today:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        timezone:
          type: string
        role:
          enum:
            - owner
            - family
            - sitter
      required:
        - minAppVersion
        - serverVersion
        - today
        - timezone
        - role
      additionalProperties: false
    Count:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required:
        - count
      additionalProperties: false
    Identity:
      type: object
      properties:
        member:
          type: object
          properties:
            id:
              type: string
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            role:
              enum:
                - owner
                - family
                - sitter
          required:
            - id
            - role
          additionalProperties: false
        household:
          type: object
          properties:
            id:
