                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                plantCount:
                  type: integer
              required:
                - id
                - plantCount
              additionalProperties: false
            - type: "null"
        rain:
          anyOf:
            - type: object
              properties:
                plantCount:
                  type: integer
                precipitationMm:
                  type: number
                ruleId:
                  type: string
                batchId:
                  anyOf:
                    - type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    - type: "null"
              required:
                - plantCount
                - precipitationMm
                - ruleId
                - batchId
              additionalProperties: false
            - type: "null"
      required:
        - locationSet
        - forecastFetchedAt
        - unavailableSince
        - snapshot
        - alerts
        - events
        - current
        - lastRainBatch
        - rain
      additionalProperties: false
    OutdoorMonths:
      type: object
      properties:
        locationSet:
          type: boolean
        pot:
          anyOf:
            - type: array
              items:
                type: integer
            - type: "null"
        ground:
          anyOf:
            - type: array
              items:
                type: integer
            - type: "null"
        hardiness:
          $ref: "#/components/schemas/CareField"
        potThresholdC:
          type: number
        groundThresholdC:
          type: number
        marginC:
          type: number
        ruleId:
          type: string
        potRuleId:
          type: string
        fetchedAt:
          anyOf:
            - type: string
              pattern: ^\d{4}-\d{2}-\d{2}T
            - type: "null"
        unavailableSince:
          anyOf:
            - type: string
              pattern: ^\d{4}-\d{2}-\d{2}T
            - type: "null"
      required:
        - locationSet
        - pot
        - ground
        - hardiness
        - potThresholdC
        - groundThresholdC
        - marginC
        - ruleId
        - potRuleId
        - fetchedAt
        - unavailableSince
      additionalProperties: false
    FeedSettings:
      type: object
      properties:
        late_tasks:
          type: boolean
        current_weather:
          type: boolean
        weather_alerts:
          type: boolean
        plant_warnings:
          type: boolean
      required:
        - late_tasks
        - current_weather
        - weather_alerts
        - plant_warnings
      additionalProperties: false
    WarningInput:
      type: object
      properties:
        value:
          description: Server-owned JSON value. Its type depends on the named care field or schedule input.
        source:
          enum:
            - override
            - perenual
            - open_plantbook
            - rule
            - unknown
            - setting
        ruleId:
          type: string
        fetchedAt:
          anyOf:
            - type: string
              pattern: ^\d{4}-\d{2}-\d{2}T
            - type: "null"
        input:
          type: string
        reason:
          type: string
      required:
        - value
        - source
        - input
      additionalProperties: false
    Warning:
      type: object
      properties:
        kind:
          enum:
            - too_dark
            - too_bright
            - no_drainage
            - missing_info
        reason:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WarningInput"
      required:
        - kind
        - reason
        - inputs
      additionalProperties: false
    FeedCard:
      oneOf:
        - type: object
          properties:
            id:
              type: string
            href:
              type: string
            kind:
              const: late_tasks
            count:
              type: integer
            plants:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  name:
                    type: string
                required:
                  - id
                  - name
                additionalProperties: false
          required:
            - id
            - href
            - kind
            - count
            - plants
          additionalProperties: false
        - type: object
          properties:
            id:
              type: string
            href:
              type: string
            kind:
              const: current_weather
            current:
              anyOf:
                - $ref: "#/components/schemas/WeatherCurrent"
                - type: "null"
            unavailableSince:
              anyOf:
                - type: string
                  pattern: ^\d{4}-\d{2}-\d{2}T
                - type: "null"
          required:
            - id
            - href
            - kind
            - current
            - unavailableSince
          additionalProperties: false
        - type: object
          properties:
            id:
              type: string
            href:
              type: string
            kind:
              const: weather_alerts
            event:
              $ref: "#/components/schemas/WeatherEvent"
          required:
            - id
            - href
            - kind
            - event
          additionalProperties: false
        - type: object
          properties:
            id:
              type: string
            href:
              type: string
            kind:
              const: plant_warnings
            plantId:
              type: string
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            plantName:
              type: string
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/Warning"
          required:
            - id
            - href
            - kind
            - plantId
            - plantName
            - warnings
          additionalProperties: false
    Feed:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/FeedCard"
        settings:
          $ref: "#/components/schemas/FeedSettings"
      required:
        - cards
      additionalProperties: false
    CareFetch:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
        attempts:
          type: integer
        next_at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T
        matchStatus:
          type: string
        pid:
          anyOf:
            - type: string
            - type: "null"
      required:
        - source
        - status
      additionalProperties: false
    PlantbookMatch:
      type: object
      properties:
        status:
          type: string
        pid:
          anyOf:
            - type: string
            - type: "null"
        checked_at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T
      required:
        - status
        - pid
        - checked_at
      additionalProperties: false
    SpeciesCare:
      type: object
      properties:
        species:
          $ref: "#/components/schemas/SpeciesRow"
        profile:
          type: object
          properties:
            wateringIntervalDays:
              $ref: "#/components/schemas/CareField"
            fertilizingIntervalDays:
              $ref: "#/components/schemas/CareField"
            light:
              $ref: "#/components/schemas/CareField"
            humidityNeed:
              $ref: "#/components/schemas/CareField"
            temperatureRangeC:
              $ref: "#/components/schemas/CareField"
            hardiness:
              $ref: "#/components/schemas/CareField"
            hardinessC:
              $ref: "#/components/schemas/CareField"
            soilMoistureRangePercent:
              $ref: "#/components/schemas/CareField"
            careText:
              $ref: "#/components/schemas/CareField"
            poisonousToPets:
              $ref: "#/components/schemas/CareField"
            poisonousToHumans:
              $ref: "#/components/schemas/CareField"
            cycle:
              $ref: "#/components/schemas/CareField"
            dimensions:
              $ref: "#/components/schemas/CareField"
            pruningMonths:
              $ref: "#/components/schemas/CareField"
            pests:
              $ref: "#/components/schemas/CareField"
            indoor:
              $ref: "#/components/schemas/CareField"
          required:
            - wateringIntervalDays
            - fertilizingIntervalDays
            - light
            - humidityNeed
            - temperatureRangeC
            - hardiness
            - hardinessC
            - soilMoistureRangePercent
            - careText
            - poisonousToPets
            - poisonousToHumans
            - cycle
            - dimensions
            - pruningMonths
            - pests
            - indoor
          additionalProperties: false
        fetches:
          type: array
          items:
            $ref: "#/components/schemas/CareFetch"
        fetch:
          anyOf:
            - $ref: "#/components/schemas/CareFetch"
            - type: "null"
        openPlantbookMatch:
          anyOf:
            - $ref: "#/components/schemas/PlantbookMatch"
            - type: "null"
      required:
        - species
        - profile
        - fetches
        - fetch
        - openPlantbookMatch
      additionalProperties: false
    Unmatched:
      type: object
      properties:
        gbif_key:
          type: integer
        canonical_name:
          type: string
        status:
          enum:
            - no_match
            - ambiguous
      required:
        - gbif_key
        - canonical_name
        - status
      additionalProperties: false
    ImportRow:
      type: object
      properties:
        can_commit:
          type: boolean
          description: The entire staged review can be committed. Repeated on every row.
        can_review:
          type: boolean
          description: This row accepts a species selection or skip.
        cover_status:
          enum: [none, pending, imported, failed, skipped]
          description: >-
            none means Planta supplied no cover; pending means an uncommitted row will try to download it;
            imported means the surviving plant records a successful cover import, even if its photo was deleted;
            failed retains the cover error; skipped means this review will not download the cover, including
            committed rows whose imported plant was later deleted. A committed row never reports pending.
        id:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        planta_plant_id:
          type: string
        mapped:
          type: object
          properties:
            nickname:
              anyOf:
                - type: string
                - type: "null"
            cultivar:
              anyOf:
                - type: string
                - type: "null"
            scientific_name:
              type: string
            site_name:
              type: string
            pot_type:
              enum:
                - plastic
                - terracotta
                - ceramic
                - glass
                - metal
                - wood
                - fabric
                - in_ground
                - other
            pot_size_cm:
              anyOf:
                - type: integer
                - type: "null"
            soil_type:
              enum:
                - all_purpose
                - cactus
                - orchid
                - aroid
                - other
            care:
              type: object
              additionalProperties:
                anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}T
            has_cover:
              type: boolean
          required:
            - nickname
            - cultivar
            - scientific_name
            - site_name
            - pot_type
            - pot_size_cm
            - soil_type
            - care
            - has_cover
          additionalProperties: false
        cover_error:
          anyOf:
            - type: string
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        selected:
          anyOf:
            - $ref: "#/components/schemas/Candidate"
            - type: "null"
        status:
          enum:
            - review
            - confirmed
            - skipped
            - committed
        plant_id:
          anyOf:
            - type: string
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            - type: "null"
      required:
        - id
        - planta_plant_id
        - can_commit
        - can_review
        - cover_status
        - mapped
        - cover_error
        - candidates
        - selected
        - status
        - plant_id
      additionalProperties: false
