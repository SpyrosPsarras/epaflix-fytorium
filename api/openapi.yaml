    delete:
      operationId: delete_api_plants__id_
      summary: DELETE /api/plants/{id}
      responses:
        "204":
          description: No content
        "426":
          description: X-App-Version is invalid or below MIN_APP_VERSION. Requests without this header are never refused.
          content:
            application/json:
              schema:
