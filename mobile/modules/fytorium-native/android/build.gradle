plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def firebaseApp = findProject(':@react-native-firebase_app') ?: project(':react-native-firebase_app')
def firebaseMessaging = findProject(':@react-native-firebase_messaging') ?: project(':react-native-firebase_messaging')
def firebaseBom = new groovy.json.JsonSlurper().parse(new File(firebaseApp.projectDir, '../package.json')).sdkVersions.android.firebase

group = "com.epaflix.fytorium"
version = "1.0.0"

android {
  namespace "com.epaflix.fytorium.platform"
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.work:work-runtime-ktx:2.11.2"
  implementation firebaseMessaging
  implementation platform("com.google.firebase:firebase-bom:${firebaseBom}")
  implementation "com.google.firebase:firebase-messaging"
}
